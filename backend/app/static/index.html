<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generic Ordering Service Enhanced — AI Console</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #4ade80;
      --warn: #fb923c;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    header .status { font-size: 13px; color: var(--muted); }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--accent); }
    .card label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    .card input, .card textarea, .card select {
      width: 100%;
      background: #0b1220;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      font-size: 13px;
      font-family: inherit;
    }
    .card textarea { min-height: 80px; resize: vertical; }
    .card button {
      margin-top: 12px;
      background: var(--accent);
      color: #0b1220;
      border: 0;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .card button:disabled { opacity: 0.5; cursor: not-allowed; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .presets button { margin-top: 0; background: #334155; color: var(--text); border: 1px solid var(--border); }
    .result h3 { color: var(--accent); font: 600 14px system-ui; margin: 12px 0 4px; }
    .result table { width: 100%; border-collapse: collapse; }
    .result th, .result td { padding: 6px; border-bottom: 1px solid var(--border); text-align: left; }
    .result {
      margin-top: 12px;
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      max-height: 320px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.ok  { background: rgba(74,222,128,.15); color: var(--ok); }
    .badge.warn { background: rgba(251,146,60,.15); color: var(--warn); }
    .badge.err { background: rgba(248,113,113,.15); color: var(--err); }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Generic Ordering Service Enhanced — AI Console</h1>
    <div class="status">AI status: <span id="ai-status" class="badge warn">checking…</span></div>
  </header>

  <nav><a href="/ai-workspace">Authenticated native AI workspace</a></nav><main>
    <section class="card">
      <h2>Single-turn chat</h2>
      <label for="chat-sector">Sector (optional)</label>
      <select id="chat-sector"><option value="">auto-detect</option></select><p id="chat-sector-note" role="status"></p>
      <label for="chat-message">Message</label>
      <textarea id="chat-message" placeholder="e.g. I'd like to book a haircut for tomorrow"></textarea>
      <div class="presets" data-preset-for="chat"></div>
      <button id="chat-send">Send</button>
      <div class="result" id="chat-result">—</div>
    </section>

    <section class="card">
      <h2>Detect sector</h2>
      <label for="detect-message">Message</label>
      <textarea id="detect-message" placeholder="e.g. my car won't start"></textarea>
      <div class="presets" data-preset-for="detect"></div>
      <button id="detect-send">Detect</button>
      <div class="result" id="detect-result">—</div>
    </section>

    <section class="card">
      <h2>Process order</h2>
      <label for="order-sector">Sector (optional)</label>
      <select id="order-sector"><option value="">auto-detect</option></select><p id="order-sector-note" role="status"></p>
      <label for="order-query">Query</label>
      <textarea id="order-query" placeholder="e.g. cheese pizza large"></textarea>
      <div class="presets" data-preset-for="order"></div>
      <button id="order-send">Process</button>
      <div class="result" id="order-result">—</div>
    </section>

    <section class="card">
      <h2>Multi-message conversation</h2>
      <label for="conv-messages">One message per line</label>
      <textarea id="conv-messages" placeholder="hello&#10;I'd like to order something&#10;maybe a pizza"></textarea>
      <div class="presets" data-preset-for="conv"></div>
      <button id="conv-send">Replay</button>
      <div class="result" id="conv-result">—</div>
    </section>
  </main>

  <footer>POST endpoints under <code>/api/ai/*</code>. Returns 503 if <code>OPENROUTER_API_KEY</code> is unset.</footer>

  <script>
    const $ = (id) => document.getElementById(id);

    async function call(path, body) {
      const opts = { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      return { ok: res.ok, status: res.status, data };
    }

    function report(parent, value) {
      if (typeof value === "string" && /^[\[{]/.test(value.trim())) {
        try { value = JSON.parse(value); } catch { /* Keep prose as text. */ }
      }
      if (value === null || value === undefined) { parent.append("Not supplied"); return; }
      if (Array.isArray(value)) {
        if (!value.length) { parent.append("No items returned"); return; }
        const rows = value.every(row => row && typeof row === "object" && !Array.isArray(row) && Object.values(row).every(cell => cell === null || typeof cell !== "object"));
        if (rows) {
          const keys = [...new Set(value.flatMap(row => Object.keys(row)))];
          const table = document.createElement("table"), head = table.createTHead().insertRow();
          keys.forEach(key => { const th = document.createElement("th"); th.textContent = label(key); head.append(th); });
          const body = table.createTBody();
          value.forEach(row => { const tr = body.insertRow(); keys.forEach(key => report(tr.insertCell(), row[key])); });
          parent.append(table);
        } else {
          const list = document.createElement("ul");
          value.forEach(item => { const li = document.createElement("li"); report(li, item); list.append(li); });
          parent.append(list);
        }
        return;
      }
      if (typeof value === "object") {
        Object.entries(value).forEach(([key, item]) => {
          const section = document.createElement("section"), heading = document.createElement("h3");
          heading.textContent = label(key); section.append(heading); report(section, item); parent.append(section);
        });
        return;
      }
      parent.append(value === "" ? "Empty string" : String(value));
    }
    const label = key => key.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/[_-]/g, " ").replace(/^./, first => first.toUpperCase());
    function show(targetId, result) {
      const el = $(targetId); el.replaceChildren();
      const status = document.createElement("h3"); status.textContent = `Response (${result.status})`; el.append(status);
      report(el, result.data);
    }

    const examples = {
      chat: [
        ["Hair appointment", "I'd like a haircut tomorrow afternoon. What appointment times are available?", "beauty_salon"],
        ["Hotel booking", "Do you have a double room available for two nights next week?", "travel_hotel"],
        ["Dinner delivery", "Can I order two vegetarian pizzas for delivery this evening?", "food_delivery"]
      ],
      detect: [
        ["Vehicle repair", "My car will not start and I need roadside help."],
        ["Pet care", "I need an appointment for my dog's annual wellness check."],
        ["Home repair", "My kitchen sink is leaking under the cabinet."]
      ],
      order: [
        ["Pizza order", "One large cheese pizza and two sparkling waters for pickup.", "food_delivery"],
        ["Laundry pickup", "Please collect two bags of laundry tomorrow morning.", "laundry_services"],
        ["Hotel room", "Book a double room for two guests for next Friday night.", "travel_hotel"]
      ],
      conv: [
        ["Dinner conversation", "Hello\nI'd like to order a vegetarian pizza\nPlease make it a large for pickup"],
        ["Hotel conversation", "Hi\nI need a room next weekend\nDo you have a double room for two?"],
        ["Repair conversation", "Hello\nMy kitchen sink is leaking\nCan a plumber visit tomorrow morning?"]
      ]
    };
    for (const [kind, presets] of Object.entries(examples)) {
      const holder = document.querySelector(`[data-preset-for="${kind}"]`);
      presets.forEach(([name, message, sector]) => {
        const button = document.createElement("button"); button.type = "button"; button.textContent = name;
        button.addEventListener("click", () => {
          $(kind === "chat" ? "chat-message" : kind === "detect" ? "detect-message" : kind === "order" ? "order-query" : "conv-messages").value = message;
          if (kind === "chat" || kind === "order") {
            const select = $(kind + "-sector");
            const available = [...select.options].some(option => option.value === sector);
            select.value = available ? sector : "";
            $(kind + "-sector-note").textContent = available ? "" : "Sector list unavailable; choose a real sector when loaded, or review auto-detection.";
          }
        });
        holder.append(button);
      });
    }

    async function loadStatus() {
      try {
        const h = await call("/api/ai/health");
        const s = $("ai-status");
        if (!h.ok) { s.textContent = "error"; s.className = "badge err"; return; }
        if (h.data.configured) { s.textContent = "configured"; s.className = "badge ok"; }
        else { s.textContent = "no API key"; s.className = "badge warn"; }
      } catch (e) {
        $("ai-status").textContent = "unreachable";
        $("ai-status").className = "badge err";
      }
    }

    async function loadSectors() {
      try {
        const r = await call("/api/ai/sectors");
        if (!r.ok || !Array.isArray(r.data.sectors)) return;
        for (const id of ["chat-sector", "order-sector"]) {
          const sel = $(id);
          for (const sec of r.data.sectors) {
            const opt = document.createElement("option");
            opt.value = sec; opt.textContent = sec;
            sel.appendChild(opt);
          }
        }
      } catch (e) { /* silent */ }
    }

    $("chat-send").onclick = async () => {
      const body = { message: $("chat-message").value };
      const sector = $("chat-sector").value;
      if (sector) body.sector = sector;
      show("chat-result", await call("/api/ai/chat", body));
    };

    $("detect-send").onclick = async () => {
      const body = { message: $("detect-message").value };
      show("detect-result", await call("/api/ai/detect-sector", body));
    };

    $("order-send").onclick = async () => {
      const body = { query: $("order-query").value };
      const sector = $("order-sector").value;
      if (sector) body.sector = sector;
      show("order-result", await call("/api/ai/order", body));
    };

    $("conv-send").onclick = async () => {
      const messages = $("conv-messages").value.split("\n").map(s => s.trim()).filter(Boolean);
      show("conv-result", await call("/api/ai/conversation", { messages }));
    };

    loadStatus();
    loadSectors();
  </script>
</body>
</html>
